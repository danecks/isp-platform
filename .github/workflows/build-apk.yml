name: Build APK (ISP Operaciones)

# Se dispara al pushear un tag `mobile-vX.Y.Z`. El sufijo se usa como
# versionName y los commits desde el tag previo definen el versionCode.
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 -w0 del keystore.jks
#   KEYSTORE_PASSWORD  contraseña del store
#   KEY_ALIAS          alias dentro del keystore (default: ispsa)
#   KEY_PASSWORD       contraseña de la key
on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semántica (ej: 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear releases
    steps:
      - uses: actions/checkout@v4

      - name: Derivar versión
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/mobile-v* ]]; then
            V="${GITHUB_REF#refs/tags/mobile-v}"
          else
            V="${{ inputs.version }}"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          # versionCode = epoch en minutos — monótono y único por build
          echo "code=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_OUTPUT"

      - name: Setup Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm --filter @workspace/isp-web build
        env:
          PORT: "5173"
          BASE_PATH: "/"

      - name: Copiar bundle al wrapper mobile
        run: pnpm --filter @workspace/isp-mobile-android run copy:web

      - name: Capacitor add android (si no existe)
        working-directory: artifacts/isp-mobile-android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Bumpear AGP + Gradle wrapper (soporte compileSdk 35)
        # El template de @capacitor/android@6.x genera AGP 8.2.1 que solo
        # soporta hasta compileSdk 34. Algunos plugins requieren 35 y el
        # build falla. Este script bumpea a AGP 8.7.2 + Gradle 8.9.
        working-directory: artifacts/isp-mobile-android
        run: node ./scripts/patch-android-gradle.mjs

      - name: Aplicar signing-block
        working-directory: artifacts/isp-mobile-android
        run: |
          BLOCK=$(cat android-templates/signing-block.gradle)
          # Append idempotente: si el marker ya está, no agregar dos veces.
          if ! grep -q "ISP signing-block" android/app/build.gradle; then
            {
              echo
              echo "// ── ISP signing-block ─────────────────────────────"
              echo "$BLOCK"
            } >> android/app/build.gradle
          fi

      - name: Aplicar permisos + <service> al AndroidManifest
        # Inserta de forma idempotente los <uses-permission> y el <service>
        # de @capacitor-community/background-geolocation. Sin esto, el APK
        # buildeado por CI no tiene los permisos de background GPS y el
        # plugin no funciona al minimizar la app.
        working-directory: artifacts/isp-mobile-android
        run: node ./scripts/apply-android-manifest.mjs

      - name: Decodificar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > artifacts/isp-mobile-android/keystore.jks

      - name: Build APK release firmado
        working-directory: artifacts/isp-mobile-android/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/artifacts/isp-mobile-android/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MOBILE_VERSION_NAME: ${{ steps.ver.outputs.name }}
          MOBILE_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK
        run: |
          APK=$(ls artifacts/isp-mobile-android/android/app/build/outputs/apk/release/*.apk | head -n1)
          DST="ISP-Operaciones-v${{ steps.ver.outputs.name }}.apk"
          cp "$APK" "$DST"
          echo "APK_PATH=$DST" >> "$GITHUB_ENV"

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        with:
          files: ${{ env.APK_PATH }}
          name: "ISP Operaciones v${{ steps.ver.outputs.name }}"
          body: |
            APK firmado de ISP Operaciones.

            **Instalación:** descargá el `.apk` desde tu Android, abrilo y
            permití "instalar de fuentes desconocidas" si te lo pide.
            Compatible con Android 7+ (API 24).
          generate_release_notes: true

      - name: Subir como artifact (siempre)
        uses: actions/upload-artifact@v4
        with:
          name: isp-operaciones-apk
          path: ${{ env.APK_PATH }}
