kind = "web"
previewPath = "/"
title = "ISP - Investigaciones y Seguridad Profesional S.A."
version = "1.0.0"
id = "artifacts/isp-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21514

[services.development]
run = "pnpm --filter @workspace/isp-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/isp-web", "run", "build" ]
publicDir = "artifacts/isp-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21514"
BASE_PATH = "/"
