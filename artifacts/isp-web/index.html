<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>ISP, S.A. — Investigaciones y Seguridad Profesional S.A.</title>
    <link rel="icon" type="image/png" href="/images/logo-isp.png" />
    <meta name="theme-color" content="#060e1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ISP" />
    <link rel="apple-touch-icon" href="/images/logo-isp.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Hot-fix: limpiar Service Worker y caches viejos UNA VEZ por navegador.
      // Necesario porque versiones previas del PWA podían quedar sirviendo
      // un bundle JS desactualizado (ej. cálculos de fecha con bug de zona
      // horaria). Se ejecuta antes del bundle para no depender de él.
      (function () {
        try {
          var KEY = "isp_pwa_purge_v1";
          if (localStorage.getItem(KEY) === "done") return;
          localStorage.setItem(KEY, "done");
          var tasks = [];
          if ("serviceWorker" in navigator) {
            tasks.push(
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(
                    regs.map(function (r) {
                      return r.unregister();
                    }),
                  );
                })
                .catch(function () {}),
            );
          }
          if (typeof caches !== "undefined" && caches && caches.keys) {
            tasks.push(
              caches
                .keys()
                .then(function (keys) {
                  return Promise.all(
                    keys.map(function (k) {
                      return caches.delete(k);
                    }),
                  );
                })
                .catch(function () {}),
            );
          }
          if (tasks.length) {
            Promise.all(tasks).finally(function () {
              window.location.reload();
            });
          }
        } catch (_) {
          // Storage no disponible — ignorar.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
